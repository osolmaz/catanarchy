rules:
  ts.mutation-required:
    disabled: true
    reason: The project uses deterministic unit, property, replay, and conformance tests instead of mutation testing.
typescript:
  coverage:
    threshold: 85
  complexity:
    max: 8
  dry:
    max_findings: 0
    paths:
      - packages
      - apps
    exclude:
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "dist/**"
      - "node_modules/**"
    copied_blocks:
      enabled: true
      min_tokens: 100
  dependency_boundaries:
    - from: packages/protocol/src
      allow: []
    - from: packages/engine/src
      allow:
        - packages/protocol/src
    - from: apps/cli/src
      allow:
        - packages/engine/src
        - packages/protocol/src
    - from: apps/web/src
      allow:
        - packages/engine/src
        - packages/protocol/src
